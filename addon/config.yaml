---
name: Offline Music Library
version: "1.1.0"
slug: music_library
description: >-
  Download and manage a music library, writing finished tracks to an NFS share
  (e.g. for Navidrome). Exposes an HTTP UI + JSON API for an OpenClaw agent.
url: https://gitlab.com/mateuszjajedev/offline-music-manager
# Pull a prebuilt image (published by CI) instead of building on HAOS.
# {arch} is substituted per architecture (amd64 / aarch64). The tag pulled is
# `version` above, so bump both together on release.
image: "mateuszjaje/offline-music-manager"
arch:
  - amd64
  - aarch64
init: false
# NFS mounting inside the container requires elevated privileges.
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
apparmor: false
# Map HA storage too, so the output dir can alternatively point at /share or /media.
map:
  - share:rw
  - media:rw
# Fixed host port -> reachable as IP:PORT on the local network (OpenClaw uses this).
# 57381 is in the IANA dynamic/private range (49152-65535) to avoid collisions.
ports:
  "57381/tcp": 57381
ports_description:
  "57381/tcp": Web UI and JSON API (used by the OpenClaw plugin)
# Adds an "Open Web UI" button on the add-on page linking to the server.
# [HOST] = HAOS IP, [PORT:57381] = the host port mapped from container 57381.
webui: "http://[HOST]:[PORT:57381]"
options:
  http_port: 57381
  nfs_enabled: true
  nfs_export: "192.168.0.20:/volume1/music"
  nfs_options: "rw,vers=4,proto=tcp,hard,timeo=600"
  output_subdir: ""
  postgres_url: ""
  postgres_host: "core-postgres"
  postgres_port: 5432
  postgres_database: "music_library"
  postgres_user: "postgres"
  postgres_password: ""
  cookies_file: ""
schema:
  http_port: port
  nfs_enabled: bool
  nfs_export: str?
  nfs_options: str?
  output_subdir: str?
  postgres_url: str?
  postgres_host: str?
  postgres_port: port?
  postgres_database: str?
  postgres_user: str?
  postgres_password: password?
  cookies_file: str?
